# XT32M2X configuration (factory defaults from the User Manual, X03):
#   - Source IPv4 address:     192.168.1.201
#   - Subnet mask:             255.255.255.0
#   - Default destination:     255.255.255.255 (broadcast)
#   - Point cloud UDP port:    2368
#   - PTC port:                9347
# Set the host computer to 192.168.1.X (X in 2..200 or 202..254) with mask 255.255.255.0.
#
# Usage:
#   ros2 run hesai_ros_driver hesai_ros_driver_node \
#       --ros-args -p config_path:=$(pwd)/src/HesaiLidar_ROS_2.0/xt32m/config_xt32m.yaml
lidar:
  - driver:
      use_gpu: false
      source_type: 1                                # 1 = real-time lidar over UDP
      lidar_udp_type:
        device_ip_address: 192.168.1.201            # XT32M2X factory default
        udp_port: 2368                              # Point cloud UDP destination port
        ptc_port: 9347                              # PTC TCP port (status + correction fetch)
        multicast_ip_address: ""                    # Empty = unicast only. Set to 224.0.0.0–239.255.255.255 to join a multicast group.

        use_ptc_connected: true                     # PTC pulls the angle correction from the lidar at startup.
        host_ptc_port: 0                            # 0 = OS-assigned ephemeral source port

        # Angle correction is fetched over PTC at startup; correction_file_path is only the fallback if PTC fails.
        # Firetime is NOT fetched over PTC — firetimes_path must always be set to an absolute path on your machine.
        # The bundled files live alongside this config:
        #   <repo>/xt32m/XT32M2X_Angle_Correction_File-1.csv
        #   <repo>/xt32m/XT32M2X_Firetime_Correction_File.csv
        correction_file_path: ""
        firetimes_path: ""

        recv_point_cloud_timeout: -1
        ptc_connect_timeout: -1

        host_ip_address: ""                         # Empty -> derived from the UDP source IP
        fault_message_port: 0

        standby_mode: -1                            # -1 = leave unchanged
        speed: -1                                   # -1 = leave unchanged. XT32M2X supports 300/600/1200 RPM (5/10/20 Hz).
        ptc_mode: 0                                 # 0 = plain TCP
        certFile: ""
        privateKeyFile: ""
        caFile: ""

      pcap_type:
        pcap_path: ""
        correction_file_path: ""
        firetimes_path: ""
        pcap_play_synchronization: true
        pcap_play_in_loop: false
        play_rate_: 1.0

      rosbag_type:
        correction_file_path: ""
        firetimes_path: ""

      serial_type:
        rs485_com: ""
        rs232_com: ""
        point_cloud_baudrate: 3125000
        correction_save_path: ""
        correction_file_path: ""

      # public module
      use_timestamp_type: 0
      frame_start_azimuth: 0
      thread_num: 4
      transform_flag: false
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
      fov_start: -1
      fov_end:  -1
      channel_fov_filter_path: ""
      multi_fov_filter_ranges: ""
      enable_packet_loss_tool: true
      distance_correction_flag: false
      xt_spot_correction: false                     # XT32M2X is not the XT-S, leave OFF
      device_udp_src_port: 0
      device_fault_port: 0
      frame_frequency: 0
      default_frame_frequency: 10.0                 # 10 Hz = 600 RPM (XT32M2X default)
      echo_mode_filter: 0

    ros:
      ros_frame_id: hesai_lidar
      ros_recv_packet_topic: /lidar_packets
      ros_send_packet_topic: /lidar_packets
      ros_send_point_cloud_topic: /lidar_points
      ros_send_imu_topic: /lidar_imu
      ros_send_packet_loss_topic: /lidar_packets_loss
      send_packet_ros: false
      send_point_cloud_ros: true
      send_imu_ros: false                           # XT32M2X has no built-in IMU
